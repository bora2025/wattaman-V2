name: wattanam-v2

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wattanam}
      POSTGRES_USER: ${POSTGRES_USER:-wattanam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [wattanam_private]

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${APP_NODE_ENV:-production}
      PROCESS_ROLE: ${PROCESS_ROLE:-combined}
      PORT: 3001
      APP_VERSION: ${APP_VERSION:-0.1.0}
      DATABASE_URL: postgresql://${POSTGRES_USER:-wattanam}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-wattanam}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ORIGINS: ${APP_URL:-http://localhost:3000}
      PUBLIC_APP_URL: ${APP_URL:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      BACKUP_DIR: /data/backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      PLUGIN_DIR: /data/plugins
      PLUGIN_DATA_DIR: /data/plugin-data
      PLUGIN_STORAGE_MAX_FILE_BYTES: ${PLUGIN_STORAGE_MAX_FILE_BYTES:-1048576}
      PLUGIN_STORAGE_PROVIDER: ${PLUGIN_STORAGE_PROVIDER:-local}
      PLUGIN_STORAGE_S3_ENDPOINT: ${PLUGIN_STORAGE_S3_ENDPOINT:-}
      PLUGIN_STORAGE_S3_BUCKET: ${PLUGIN_STORAGE_S3_BUCKET:-}
      PLUGIN_STORAGE_S3_REGION: ${PLUGIN_STORAGE_S3_REGION:-auto}
      PLUGIN_STORAGE_S3_ACCESS_KEY_ID: ${PLUGIN_STORAGE_S3_ACCESS_KEY_ID:-}
      PLUGIN_STORAGE_S3_SECRET_ACCESS_KEY: ${PLUGIN_STORAGE_S3_SECRET_ACCESS_KEY:-}
      PLUGIN_STORAGE_S3_FORCE_PATH_STYLE: ${PLUGIN_STORAGE_S3_FORCE_PATH_STYLE:-true}
      PLUGIN_STORAGE_S3_PREFIX: ${PLUGIN_STORAGE_S3_PREFIX:-plugin-data}
      PLUGIN_SAFE_MODE: ${PLUGIN_SAFE_MODE:-false}
      PLUGIN_TRUSTED_KEYS_FILE: /run/plugin-keys/trusted-keys.json
      PLUGIN_TRUSTED_KEYS: ${PLUGIN_TRUSTED_KEYS:-{}}
      MARKETPLACE_URL: ${MARKETPLACE_URL:-}
      UPDATE_CHANNEL: ${UPDATE_CHANNEL:-stable}
      UPDATE_REPOSITORY_KEY_ID: ${UPDATE_REPOSITORY_KEY_ID:-official-repository-2026}
      UPDATE_REPOSITORY_PUBLIC_KEY_FILE: /run/update-repository/plugin-signing-public.pem
      UPDATE_REPOSITORY_PUBLIC_KEY: ${UPDATE_REPOSITORY_PUBLIC_KEY:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - backups:/data/backups
      - plugins:/data/plugins
      - plugin_data:/data/plugin-data
      - ./secrets/plugin-keys:/run/plugin-keys:ro
      - ./secrets/update-repository:/run/update-repository:ro
    networks: [wattanam_private]

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      API_URL: http://api:3001
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/setup').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    networks: [wattanam_private]

  gateway:
    build:
      context: ./infrastructure/gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      API_UPSTREAM: api:3001
      WEB_UPSTREAM: web:3000
    ports:
      - "${WEB_PORT:-3000}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/gateway-health"]
      interval: 10s
      timeout: 5s
      retries: 8
    networks: [wattanam_private]

  worker:
    profiles: ["split-worker"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${APP_NODE_ENV:-production}
      PROCESS_ROLE: worker
      WORKER_PORT: 3002
      APP_VERSION: ${APP_VERSION:-0.1.0}
      DATABASE_URL: postgresql://${POSTGRES_USER:-wattanam}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-wattanam}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ORIGINS: ${APP_URL:-http://localhost:3000}
      PUBLIC_APP_URL: ${APP_URL:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      BACKUP_DIR: /data/backups
      PLUGIN_DIR: /data/plugins
      PLUGIN_DATA_DIR: /data/plugin-data
      PLUGIN_STORAGE_PROVIDER: ${PLUGIN_STORAGE_PROVIDER:-local}
      PLUGIN_STORAGE_S3_ENDPOINT: ${PLUGIN_STORAGE_S3_ENDPOINT:-}
      PLUGIN_STORAGE_S3_BUCKET: ${PLUGIN_STORAGE_S3_BUCKET:-}
      PLUGIN_STORAGE_S3_REGION: ${PLUGIN_STORAGE_S3_REGION:-auto}
      PLUGIN_STORAGE_S3_ACCESS_KEY_ID: ${PLUGIN_STORAGE_S3_ACCESS_KEY_ID:-}
      PLUGIN_STORAGE_S3_SECRET_ACCESS_KEY: ${PLUGIN_STORAGE_S3_SECRET_ACCESS_KEY:-}
      PLUGIN_TRUSTED_KEYS: ${PLUGIN_TRUSTED_KEYS:-{}}
      MARKETPLACE_URL: ${MARKETPLACE_URL:-}
    command: ["node", "dist/worker"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - backups:/data/backups
      - plugins:/data/plugins:ro
      - plugin_data:/data/plugin-data
    networks: [wattanam_private]

  backup:
    profiles: ["operations"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-wattanam}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-wattanam}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      BACKUP_DIR: /data/backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    command: ["node", "scripts/backup-database.js"]
    volumes:
      - backups:/data/backups
    networks: [wattanam_private]

volumes:
  postgres_data:
  backups:
  plugins:
  plugin_data:

networks:
  wattanam_private:
    driver: bridge
