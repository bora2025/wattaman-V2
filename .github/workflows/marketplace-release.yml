name: Signed Marketplace release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-sign-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
      - id: marketplace_api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/marketplace-api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/wattanam-marketplace-api:${{ inputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Sign immutable image
        env:
          API_IMAGE: ghcr.io/${{ github.repository_owner }}/wattanam-marketplace-api@${{ steps.marketplace_api.outputs.digest }}
        run: cosign sign --yes "$API_IMAGE"
      - name: Generate release blueprint
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          API_IMAGE: ghcr.io/${{ github.repository_owner }}/wattanam-marketplace-api@${{ steps.marketplace_api.outputs.digest }}
        run: |
          node -e "const fs=require('fs'); const release={schemaVersion:1,release:{version:process.env.RELEASE_VERSION,commit:process.env.GITHUB_SHA,repository:process.env.GITHUB_REPOSITORY},services:{marketplaceApi:{image:process.env.API_IMAGE}}}; fs.writeFileSync('marketplace-release.json', JSON.stringify(release,null,2)+'\n');"
      - uses: actions/upload-artifact@v4
        with:
          name: marketplace-release-${{ inputs.version }}
          path: marketplace-release.json
          if-no-files-found: error
          retention-days: 90
