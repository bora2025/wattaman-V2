name: Uptime

# Every 5 minutes: is the live school and marketplace up? A failed run makes GitHub email the repo
# owner (Settings → Notifications → Actions). GitHub may delay scheduled runs by a few minutes.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: School and marketplace respond
        env:
          UPTIME_TARGETS: >-
            [
              {"name":"school web (gateway)","url":"https://gateway-production-d585.up.railway.app/login"},
              {"name":"school API health","url":"https://gateway-production-d585.up.railway.app/api/health","expectText":"\"status\":\"ok\""},
              {"name":"marketplace API ready","url":"https://marketplace-api-production-5bc1.up.railway.app/health/ready","expectText":"\"status\":\"ready\""},
              {"name":"platform admin","url":"https://platform-admin-web-production-22b4.up.railway.app/login"}
            ]
        run: node tools/check-uptime.js
