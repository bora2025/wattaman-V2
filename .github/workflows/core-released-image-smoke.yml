name: Released core deployment smoke

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: GitHub Actions run containing the retained release evidence
        required: true
      version:
        description: Released semantic version without v prefix
        required: true

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  released-core-deployment-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: sigstore/cosign-installer@v3.8.2
      - uses: actions/download-artifact@v4
        with:
          name: core-${{ inputs.version }}-release-evidence
          path: release-artifact
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ github.token }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Verify retained blueprint and immutable image signatures
        run: |
          node tools/verify-school-release.js release-artifact/school-release.json
          node tools/verify-core-image-signatures.js --blueprint release-artifact/school-release.json
      - name: Configure exact released deployment
        env:
          VERSION: ${{ inputs.version }}
        run: |
          docker pull postgres:16-alpine
          POSTGRES_IMAGE=$(docker image inspect postgres:16-alpine --format '{{index .RepoDigests 0}}')
          API_IMAGE=$(node -p "require('./release-artifact/school-release.json').services.api.image")
          WEB_IMAGE=$(node -p "require('./release-artifact/school-release.json').services.web.image")
          GATEWAY_IMAGE=$(node -p "require('./release-artifact/school-release.json').services.gateway.image")
          openssl genpkey -algorithm ED25519 -out /tmp/core-released-smoke-private.pem
          openssl pkey -in /tmp/core-released-smoke-private.pem -pubout -out /tmp/core-released-smoke-public.pem
          PUBLIC_KEY_ESCAPED=$(awk '{printf "%s\\n", $0}' /tmp/core-released-smoke-public.pem)
          {
            echo "POSTGRES_IMAGE=$POSTGRES_IMAGE"
            echo "API_IMAGE=$API_IMAGE"
            echo "WEB_IMAGE=$WEB_IMAGE"
            echo "GATEWAY_IMAGE=$GATEWAY_IMAGE"
            echo 'POSTGRES_PASSWORD=released-core-smoke-postgres-password'
            echo "APP_VERSION=$VERSION"
            echo 'JWT_SECRET=released-core-smoke-jwt-secret-at-least-thirty-two-characters'
            echo 'APP_URL=http://127.0.0.1:3000'
            echo 'COOKIE_SECURE=false'
            echo 'PLUGIN_TRUSTED_KEYS={}'
            echo 'REQUIRE_PLUGIN_BACKUP_CONTRACTS=true'
            echo 'MARKETPLACE_URL=https://marketplace-api-production-f821.up.railway.app'
            echo 'UPDATE_REPOSITORY_KEY_ID=released-core-smoke'
            printf 'UPDATE_REPOSITORY_PUBLIC_KEY="%s"\n' "$PUBLIC_KEY_ESCAPED"
          } > .env.core-released-smoke
          chmod 600 .env.core-released-smoke
      - name: Boot and install the exact released core images
        run: |
          docker compose --env-file .env.core-released-smoke -f docker-compose.core.yml up -d
          node tools/core-deployment-smoke.js
          docker compose --env-file .env.core-released-smoke -f docker-compose.core.yml exec -T api \
            node scripts/verify-fresh-core-database.js
      - name: Back up and restore the released installation
        run: |
          docker compose --env-file .env.core-released-smoke -f docker-compose.core.yml exec -T api \
            sh -c "mkdir -p /data/plugins/wattanam.smoke/1.0.0/backend /data/plugin-data/wattanam.smoke && printf '%s\n' '{\"schemaVersion\":1,\"id\":\"wattanam.smoke\",\"name\":\"Recovery Smoke\",\"description\":\"Released-image recovery fixture.\",\"version\":\"1.0.0\",\"requiresCore\":\">=0.1.0-0 <1.0.0\",\"publisher\":\"wattanam\",\"license\":\"commercial\",\"backendEntry\":\"backend/index.js\",\"capabilities\":[],\"permissions\":[],\"dependencies\":{},\"migrations\":[],\"navigation\":[],\"supportedLanguages\":[\"en\"],\"operational\":{\"healthCheck\":\"runtime\",\"dataClassification\":[\"personal-data\"],\"backup\":{\"database\":\"required\",\"files\":\"required\",\"restore\":\"required\"},\"uninstall\":{\"dataRetention\":\"preserve\"},\"pricing\":\"marketplace\"}}' > /data/plugins/wattanam.smoke/1.0.0/plugin.json && printf 'module.exports={id:\"wattanam.smoke\",health(){return {status:\"ready\"}}};\n' > /data/plugins/wattanam.smoke/1.0.0/backend/index.js && printf 'released-mutable-plugin-state\n' > /data/plugin-data/wattanam.smoke/state.txt"
          docker compose --env-file .env.core-released-smoke -f docker-compose.core.yml --profile operations run --rm backup
          docker compose --env-file .env.core-released-smoke -f docker-compose.core.yml --profile recovery-drill run --rm restore
          docker compose --env-file .env.core-released-smoke -f docker-compose.core.yml --profile recovery-drill exec -T postgres_restore \
            psql -U wattanam -d wattanam -v ON_ERROR_STOP=1 -c \
            "DO \$\$ BEGIN IF (SELECT \"schoolSlug\" FROM \"Installation\" WHERE id='singleton') <> 'core-smoke-school' THEN RAISE EXCEPTION 'restored school identity mismatch'; END IF; IF (SELECT lineage FROM _wattanam_schema_lineage WHERE id='singleton') <> 'wattanam-core-v1' THEN RAISE EXCEPTION 'restored schema lineage mismatch'; END IF; END \$\$;"
          docker compose --env-file .env.core-released-smoke -f docker-compose.core.yml --profile recovery-drill run --rm --no-deps restore \
            sh -c "grep -q '\"id\":\"wattanam.smoke\"' /restore/plugins/wattanam.smoke/1.0.0/plugin.json && grep -qx 'released-mutable-plugin-state' /restore/plugin-data/wattanam.smoke/state.txt"
      - name: Capture diagnostics on failure
        if: failure()
        run: test ! -f .env.core-released-smoke || docker compose --env-file .env.core-released-smoke -f docker-compose.core.yml logs --no-color
      - name: Stop isolated released deployment
        if: always()
        run: test ! -f .env.core-released-smoke || docker compose --env-file .env.core-released-smoke -f docker-compose.core.yml down -v --remove-orphans
