name: Promote core release

on:
  workflow_dispatch:
    inputs:
      version: { description: Tested beta semantic version, required: true }

permissions: { contents: read }

jobs:
  promote-without-rebuild:
    runs-on: ubuntu-24.04
    environment: marketplace-production
    steps:
      - uses: actions/checkout@v4
      - name: Promote existing beta metadata and digests
        env:
          MARKETPLACE_URL: ${{ secrets.MARKETPLACE_URL }}
          MARKETPLACE_ADMIN_TOKEN: ${{ secrets.MARKETPLACE_ADMIN_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: node tools/promote-core-release.js
