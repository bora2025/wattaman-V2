name: Marketplace PR validation

on:
  pull_request:
  workflow_dispatch:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history for committed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.29.1

  customer-school-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out Marketplace candidate
        uses: actions/checkout@v4
        with:
          path: marketplace
      - name: Check out released Customer School host
        uses: actions/checkout@v4
        with:
          repository: bora2025/Customer-School
          path: customer-school
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            marketplace/packages/plugin-cli/package-lock.json
            customer-school/backend/package-lock.json
      - name: Install host and publisher tooling
        run: |
          npm --prefix marketplace/packages/plugin-cli ci
          npm --prefix customer-school/backend ci
      - name: Verify signed catalog lifecycle and universal UI against released host
        working-directory: customer-school/backend
        env:
          PLUGIN_SOURCE_CATALOG: ${{ github.workspace }}/marketplace/plugins
        run: >-
          npm test -- --runInBand
          src/plugins/all-plugin-package-lifecycle.spec.ts
          src/plugins/plugin-ui-schema.spec.ts

  contracts-and-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Install contract and plugin tooling dependencies
        run: |
          npm --prefix packages/marketplace-contracts ci
          npm --prefix packages/plugin-sdk ci
          npm --prefix packages/plugin-cli ci
      - name: Test contracts and plugin tooling
        run: |
          npm run test:contracts
          npm run test:sdk
          npm run test:cli
          npm run test:tools
          npm run plugins:check:universal
      - name: Build plugin SDK
        run: npm run build:sdk
      - name: Audit production plugin tooling dependencies
        run: |
          npm --prefix packages/plugin-sdk audit --omit=dev --audit-level=high
          npm --prefix packages/plugin-cli audit --omit=dev --audit-level=high
      - name: Validate control-plane deployment configuration
        run: npm run verify:control-plane

  marketplace-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wattanam
          POSTGRES_PASSWORD: pr-validation-password
          POSTGRES_DB: wattanam_marketplace
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wattanam -d wattanam_marketplace"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://wattanam:pr-validation-password@localhost:5432/wattanam_marketplace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: apps/marketplace-api/package-lock.json }
      - name: Install
        working-directory: apps/marketplace-api
        run: npm ci
      - name: Validate and migrate schema
        working-directory: apps/marketplace-api
        run: npm run db:validate && npm run db:generate && npm run db:migrate:deploy
      - name: Test and build
        working-directory: apps/marketplace-api
        run: npm test && npm run certify:starter-bundles:postgres && npm run build
      - name: Test official plugin behavior owned by Marketplace
        run: npm run test:official-plugins
      - name: Audit production dependencies
        working-directory: apps/marketplace-api
        run: npm audit --omit=dev --audit-level=high

  artifact-s3-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARTIFACT_S3_BUCKET: wattanam-ci-artifacts
      ARTIFACT_S3_REGION: us-east-1
      ARTIFACT_S3_ENDPOINT: http://127.0.0.1:9000
      ARTIFACT_S3_FORCE_PATH_STYLE: 'true'
      ARTIFACT_S3_ACCESS_KEY_ID: wattanam-ci-access
      ARTIFACT_S3_SECRET_ACCESS_KEY: wattanam-ci-secret-password
      ARTIFACT_S3_CREATE_BUCKET: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: apps/marketplace-api/package-lock.json }
      - uses: actions/setup-go@v5
        with: { go-version: '1.24.x', cache: false }
      - name: Install Marketplace API
        working-directory: apps/marketplace-api
        run: npm ci
      - name: Start pinned S3-compatible artifact origin
        env:
          MINIO_ROOT_USER: ${{ env.ARTIFACT_S3_ACCESS_KEY_ID }}
          MINIO_ROOT_PASSWORD: ${{ env.ARTIFACT_S3_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/minio-bin" "$RUNNER_TEMP/minio-data"
          GOBIN="$RUNNER_TEMP/minio-bin" go install github.com/minio/minio@RELEASE.2025-04-22T22-12-26Z
          MINIO_ROOT_USER="$MINIO_ROOT_USER" MINIO_ROOT_PASSWORD="$MINIO_ROOT_PASSWORD" \
            nohup "$RUNNER_TEMP/minio-bin/minio" server "$RUNNER_TEMP/minio-data" --address :9000 >"$RUNNER_TEMP/minio.log" 2>&1 &
      - name: Wait for artifact origin
        run: |
          for _ in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:9000/minio/health/ready && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/minio.log"
          exit 1
      - name: Certify immutable multi-instance artifact behavior
        working-directory: apps/marketplace-api
        run: npm run drill:artifact-s3

  platform-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: apps/platform-admin/package-lock.json }
      - name: Install applications
        run: |
          npm --prefix apps/marketplace-api ci
          npm --prefix apps/platform-admin ci
      - name: Build Platform Admin
        run: npm run build:admin
      - name: Audit Platform Admin production dependencies
        working-directory: apps/platform-admin
        run: npm audit --omit=dev --audit-level=high
      - name: Run browser control-plane tests
        working-directory: apps/platform-admin
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: platform-admin-e2e-evidence
          path: |
            apps/platform-admin/playwright-report
            apps/platform-admin/test-results
          if-no-files-found: ignore
          retention-days: 14
