name: PR validation

on:
  pull_request:
  workflow_dispatch:

jobs:
  architecture-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      # First, so a pull request that adds anything unowned or unclassified stops with the gate's
      # list of what to fix rather than a generic drift message.
      - name: Reject unowned or unclassified architecture items
        run: npm run architecture:inventory:gate
      - name: Reject unreviewed architecture inventory drift
        run: npm run architecture:inventory:check && node --test tools/architecture-inventory.test.js

  control-plane-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Reject unsafe Railway control-plane configuration
        run: npm run verify:control-plane && node --test tools/verify-control-plane-config.test.js

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wattanam
          POSTGRES_PASSWORD: pr-validation-password
          POSTGRES_DB: wattanam_backend
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wattanam -d wattanam_backend"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://wattanam:pr-validation-password@localhost:5432/wattanam_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: backend/package-lock.json }
      - name: Install
        working-directory: backend
        run: npm ci
      - name: Validate schema and apply every migration (the "migration checks" gate)
        working-directory: backend
        run: npm run db:validate && npx prisma generate --schema=prisma/schema.prisma && npm run db:migrate:deploy
      - name: Typecheck
        working-directory: backend
        run: npm run typecheck
      - name: Lint
        working-directory: backend
        run: npm run lint:ci
      - name: Unit tests
        working-directory: backend
        run: npm test -- --runInBand
      - name: Certify Academic Management against real PostgreSQL
        working-directory: backend
        env:
          ACADEMIC_CERTIFY_ALLOW_DROP: academic-management-only
        run: npm run certify:academic-management:postgres
      - name: Certify Human Resources against real PostgreSQL
        working-directory: backend
        env:
          HR_CERTIFY_ALLOW_DROP: human-resources-only
        run: npm run certify:human-resources:postgres
      - name: Certify Communication against real PostgreSQL
        working-directory: backend
        env:
          COMMUNICATION_CERTIFY_ALLOW_DROP: communication-only
        run: npm run certify:communication:postgres
      - name: Certify Document Designer against real PostgreSQL
        working-directory: backend
        env:
          DOCUMENT_DESIGNER_CERTIFY_ALLOW_DROP: document-designer-only
        run: npm run certify:document-designer:postgres

      - name: Certify Attendance Manager against real PostgreSQL
        working-directory: backend
        env:
          ATTENDANCE_CERTIFY_ALLOW_DROP: attendance-manager-only
        run: npm run certify:attendance:postgres

      - name: Certify Timetable against real PostgreSQL
        working-directory: backend
        env:
          TIMETABLE_CERTIFY_ALLOW_DROP: timetable-only
        run: npm run certify:timetable:postgres

      - name: Certify Examination against real PostgreSQL
        working-directory: backend
        env:
          EXAMINATION_CERTIFY_ALLOW_DROP: examination-only
        run: npm run certify:examination:postgres

      - name: Certify Learning against real PostgreSQL
        working-directory: backend
        env:
          LEARNING_CERTIFY_ALLOW_DROP: learning-only
          LEARNING_CERTIFY_DESTRUCTIVE_APPROVAL: 014_allow_assignment_attempts
        run: npm run certify:learning:postgres
      - name: Certify Transportation against real PostgreSQL
        working-directory: backend
        env:
          TRANSPORTATION_CERTIFY_ALLOW_DROP: transportation-only
        run: npm run certify:transportation:postgres
      - name: Certify Finance against real PostgreSQL
        working-directory: backend
        env:
          FINANCE_CERTIFY_ALLOW_DROP: finance-only
        run: npm run certify:finance:postgres
      - name: Certify Parent Portal against real PostgreSQL
        working-directory: backend
        env:
          PARENT_PORTAL_CERTIFY_ALLOW_DROP: parent-portal-only
        run: npm run certify:parent-portal:postgres
      - name: Certify Reporting against real PostgreSQL read models
        working-directory: backend
        env:
          REPORTING_CERTIFY_ALLOW_WRITE: reporting-readmodels-only
        run: npm run certify:reporting:postgres
      - name: Build
        working-directory: backend
        run: npm run build
      - name: Production dependency audit (reject moderate, high, or critical findings)
        working-directory: backend
        run: npm audit --omit=dev --audit-level=moderate

  marketplace-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wattanam
          POSTGRES_PASSWORD: pr-validation-password
          POSTGRES_DB: wattanam_marketplace
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wattanam -d wattanam_marketplace"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://wattanam:pr-validation-password@localhost:5432/wattanam_marketplace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: apps/marketplace-api/package-lock.json }
      - name: Install
        working-directory: apps/marketplace-api
        run: npm ci
      - name: Validate schema and apply every migration
        working-directory: apps/marketplace-api
        run: npm run db:validate && npm run db:generate && npm run db:migrate:deploy
      - name: Unit tests
        working-directory: apps/marketplace-api
        run: npm test
      - name: Certify starter-bundle lifecycle against migrated PostgreSQL
        working-directory: apps/marketplace-api
        run: npm run certify:starter-bundles:postgres
      - name: Build (tsc -- this is also the typecheck gate for this app)
        working-directory: apps/marketplace-api
        run: npm run build
      - name: Production dependency audit
        working-directory: apps/marketplace-api
        run: npm audit --omit=dev --audit-level=high

  platform-admin-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: apps/platform-admin/package-lock.json }
      - name: Install Marketplace API dependencies
        working-directory: apps/marketplace-api
        run: npm ci
      - name: Install Platform Admin dependencies
        working-directory: apps/platform-admin
        run: npm ci
      - name: Install Chromium and operating-system dependencies
        working-directory: apps/platform-admin
        run: npx playwright install --with-deps chromium
      - name: Run Platform Admin against disposable PostgreSQL and the real Marketplace API
        working-directory: apps/platform-admin
        run: npm run e2e
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: platform-admin-e2e-evidence
          path: |
            apps/platform-admin/playwright-report
            apps/platform-admin/test-results
          if-no-files-found: ignore
          retention-days: 14

  artifact-s3-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARTIFACT_S3_BUCKET: wattanam-ci-artifacts
      ARTIFACT_S3_REGION: us-east-1
      ARTIFACT_S3_ENDPOINT: http://127.0.0.1:9000
      ARTIFACT_S3_FORCE_PATH_STYLE: 'true'
      ARTIFACT_S3_ACCESS_KEY_ID: wattanam-ci-access
      ARTIFACT_S3_SECRET_ACCESS_KEY: wattanam-ci-secret-password
      ARTIFACT_S3_CREATE_BUCKET: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: apps/marketplace-api/package-lock.json }
      - uses: actions/setup-go@v5
        with: { go-version: '1.24.x', cache: false }
      - name: Install Marketplace artifact dependencies
        working-directory: apps/marketplace-api
        run: npm ci
      - name: Build and start a pinned S3-compatible artifact origin
        env:
          MINIO_ROOT_USER: ${{ env.ARTIFACT_S3_ACCESS_KEY_ID }}
          MINIO_ROOT_PASSWORD: ${{ env.ARTIFACT_S3_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/minio-bin" "$RUNNER_TEMP/minio-data"
          GOBIN="$RUNNER_TEMP/minio-bin" go install github.com/minio/minio@RELEASE.2025-04-22T22-12-26Z
          MINIO_ROOT_USER="$MINIO_ROOT_USER" MINIO_ROOT_PASSWORD="$MINIO_ROOT_PASSWORD" \
            nohup "$RUNNER_TEMP/minio-bin/minio" server "$RUNNER_TEMP/minio-data" --address :9000 >"$RUNNER_TEMP/minio.log" 2>&1 &
      - name: Wait for the S3-compatible origin
        run: |
          for _ in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:9000/minio/health/ready && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/minio.log"
          exit 1
      - name: Certify immutable multi-instance artifact behavior
        working-directory: apps/marketplace-api
        run: npm run drill:artifact-s3
      - name: Show object-store logs on failure
        if: failure()
        run: cat "$RUNNER_TEMP/minio.log" || true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Build (Next.js type-checks during build; this is the typecheck gate for this app)
        working-directory: frontend
        run: npm run build
      - name: Production dependency audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=moderate
      # `next lint` is broken under Next 16 (the command was removed) -- a known, documented
      # gap from A-009, not something this workflow silently papers over. Fixing it means an
      # ESLint flat-config migration, tracked as separate follow-up work.

  clean-core-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Verify artifact gate fixtures
        run: node --test tools/verify-clean-core-artifact.test.js tools/marketplace-only-plugin-install-contract.test.js tools/starter-bundle-marketplace-contract.test.js tools/plugin-lifecycle-ux-contract.test.js tools/core-release-workflow-contract.test.js tools/core-deployment-blueprint-contract.test.js tools/core-deployment-smoke-contract.test.js tools/release-evidence.test.js tools/verify-core-image-signatures.test.js tools/provision-railway-school.test.js tools/publish-core-release.test.js tools/validate-core-release-input.test.js && node --test frontend/scripts/build-core.test.js
      - name: Build physical lean-core API and web artifacts
        run: npm run build:core
      - name: Reject compiled optional modules and pages
        run: npm run architecture:clean-core:gate

  core-deployment-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Verify deployment smoke contract
        run: node --test tools/core-deployment-smoke-contract.test.js backend/scripts/verify-fresh-core-database.test.js
      - name: Build physical core deployment images
        run: |
          docker build -f backend/Dockerfile.core -t wattanam-api-core:smoke backend
          docker build -f frontend/Dockerfile.core -t wattanam-web-core:smoke frontend
          docker build -f infrastructure/gateway/Dockerfile -t wattanam-gateway:smoke infrastructure/gateway
      - name: Reject development tooling or legacy Prisma state in the API runtime image
        run: |
          docker run --rm --entrypoint sh wattanam-api-core:smoke -c 'test -x node_modules/.bin/prisma'
          docker run --rm --entrypoint sh wattanam-api-core:smoke -c 'test ! -e node_modules/typescript'
          docker run --rm --entrypoint sh wattanam-api-core:smoke -c 'test ! -e node_modules/jest'
          docker run --rm --entrypoint sh wattanam-api-core:smoke -c 'test ! -e node_modules/@nestjs/cli'
          docker run --rm --entrypoint sh wattanam-api-core:smoke -c 'test ! -e prisma/schema.prisma'
          docker run --rm --entrypoint node wattanam-api-core:smoke -p "require.resolve('./generated/core-client')"
      - name: Configure isolated core deployment
        run: |
          openssl genpkey -algorithm ED25519 -out /tmp/core-smoke-private.pem
          openssl pkey -in /tmp/core-smoke-private.pem -pubout -out /tmp/core-smoke-public.pem
          PUBLIC_KEY_ESCAPED=$(awk '{printf "%s\\n", $0}' /tmp/core-smoke-public.pem)
          {
            echo 'POSTGRES_IMAGE=postgres:16-alpine'
            echo 'API_IMAGE=wattanam-api-core:smoke'
            echo 'WEB_IMAGE=wattanam-web-core:smoke'
            echo 'GATEWAY_IMAGE=wattanam-gateway:smoke'
            echo 'POSTGRES_PASSWORD=core-smoke-postgres-password'
            echo 'APP_VERSION=0.1.0-core-smoke'
            echo 'JWT_SECRET=core-smoke-jwt-secret-at-least-thirty-two-characters'
            echo 'APP_URL=http://127.0.0.1:3000'
            echo 'COOKIE_SECURE=false'
            echo 'PLUGIN_TRUSTED_KEYS={}'
            echo 'REQUIRE_PLUGIN_BACKUP_CONTRACTS=true'
            echo 'MARKETPLACE_URL=https://marketplace.invalid'
            echo 'UPDATE_REPOSITORY_KEY_ID=core-smoke'
            printf 'UPDATE_REPOSITORY_PUBLIC_KEY="%s"\n' "$PUBLIC_KEY_ESCAPED"
          } > .env.core-smoke
          chmod 600 .env.core-smoke
      - name: Boot and install a fresh core school
        run: |
          docker compose --env-file .env.core-smoke -f docker-compose.core.yml up -d
          node tools/core-deployment-smoke.js
      - name: Prove the database contains core tables and no legacy business tables
        run: |
          docker compose --env-file .env.core-smoke -f docker-compose.core.yml exec -T api \
            node scripts/verify-fresh-core-database.js
      - name: Create a recovery artifact from the persistent core volume
        run: |
          docker compose --env-file .env.core-smoke -f docker-compose.core.yml exec -T api \
            sh -c "mkdir -p /data/plugins/wattanam.smoke/1.0.0/backend /data/plugin-data/wattanam.smoke && printf '%s\n' '{\"schemaVersion\":1,\"id\":\"wattanam.smoke\",\"name\":\"Recovery Smoke\",\"description\":\"Strict recovery contract fixture.\",\"version\":\"1.0.0\",\"requiresCore\":\">=0.1.0-0 <1.0.0\",\"publisher\":\"wattanam\",\"license\":\"commercial\",\"backendEntry\":\"backend/index.js\",\"capabilities\":[],\"permissions\":[],\"dependencies\":{},\"migrations\":[],\"navigation\":[],\"supportedLanguages\":[\"en\"],\"operational\":{\"healthCheck\":\"runtime\",\"dataClassification\":[\"personal-data\"],\"backup\":{\"database\":\"required\",\"files\":\"required\",\"restore\":\"required\"},\"uninstall\":{\"dataRetention\":\"preserve\"},\"pricing\":\"marketplace\"}}' > /data/plugins/wattanam.smoke/1.0.0/plugin.json && printf 'module.exports={id:\"wattanam.smoke\",health(){return {status:\"ready\"}}};\n' > /data/plugins/wattanam.smoke/1.0.0/backend/index.js && printf 'mutable-plugin-state\n' > /data/plugin-data/wattanam.smoke/state.txt"
          docker compose --env-file .env.core-smoke -f docker-compose.core.yml --profile operations run --rm backup
          docker compose --env-file .env.core-smoke -f docker-compose.core.yml exec -T api \
            sh -c "test -n \"$$(find /data/backups -type f -name '*.recovery-set.json' -size +0c -print -quit)\""
          docker compose --env-file .env.core-smoke -f docker-compose.core.yml exec -T api \
            sh -c "grep -q '\"format\": \"wattanam-recovery-set-v2\"' /data/backups/*.recovery-set.json && grep -q '\"legacyExceptionCount\": 0' /data/backups/*.recovery-set.json"
      - name: Restore and reconcile the full recovery set in an isolated database
        run: |
          docker compose --env-file .env.core-smoke -f docker-compose.core.yml --profile recovery-drill run --rm restore
          docker compose --env-file .env.core-smoke -f docker-compose.core.yml --profile recovery-drill exec -T postgres_restore \
            psql -U wattanam -d wattanam -v ON_ERROR_STOP=1 -c \
            "DO \$\$ BEGIN IF (SELECT \"schoolSlug\" FROM \"Installation\" WHERE id='singleton') <> 'core-smoke-school' THEN RAISE EXCEPTION 'restored school identity mismatch'; END IF; IF (SELECT lineage FROM _wattanam_schema_lineage WHERE id='singleton') <> 'wattanam-core-v1' THEN RAISE EXCEPTION 'restored schema lineage mismatch'; END IF; END \$\$;"
          docker compose --env-file .env.core-smoke -f docker-compose.core.yml --profile recovery-drill run --rm --no-deps restore \
            sh -c "grep -q '\"id\":\"wattanam.smoke\"' /restore/plugins/wattanam.smoke/1.0.0/plugin.json && grep -qx 'mutable-plugin-state' /restore/plugin-data/wattanam.smoke/state.txt"
      - name: Capture diagnostics on failure
        if: failure()
        run: docker compose --env-file .env.core-smoke -f docker-compose.core.yml logs --no-color
      - name: Stop isolated core deployment
        if: always()
        run: docker compose --env-file .env.core-smoke -f docker-compose.core.yml down -v --remove-orphans

  existing-school-upgrade-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wattanam
          POSTGRES_PASSWORD: rehearsal-password
          POSTGRES_DB: source_school
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wattanam -d source_school"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      EXISTING_SCHOOL_REHEARSAL_ALLOW: document-designer-only
      SOURCE_DATABASE_URL: postgresql://wattanam:rehearsal-password@localhost:5432/source_school
      REHEARSAL_DATABASE_URL: postgresql://wattanam:rehearsal-password@localhost:5432/restored_school
      BACKUP_DIR: /tmp/existing-school-rehearsal
      REHEARSAL_SCHOOL_SLUG: restored-document-school
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: backend/package-lock.json }
      - name: Install matching PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Verify rehearsal safety contract
        working-directory: backend
        run: npm run test:existing-school:document-designer
      - name: Restore, adopt, reconcile and roll back Document Designer
        working-directory: backend
        run: node scripts/document-designer-restored-backup-certification.js --out "$RUNNER_TEMP/existing-school-document-designer-report.json"
      - name: Retain non-secret rehearsal evidence
        uses: actions/upload-artifact@v4
        with:
          name: existing-school-document-designer-rehearsal
          path: ${{ runner.temp }}/existing-school-document-designer-report.json
          if-no-files-found: error

