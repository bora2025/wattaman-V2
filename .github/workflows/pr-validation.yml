  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Scan the PR diff for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dockerfile-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dockerfile:
          - Dockerfile
          - frontend/Dockerfile
          - backend/Dockerfile
          - backend/Dockerfile.core
          - frontend/Dockerfile.core
          - apps/marketplace-api/Dockerfile
          - infrastructure/railway/platform-admin.Dockerfile
          - infrastructure/gateway/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: hadolint (fails only on error-level findings; style warnings are pre-existing and tracked separately)
