name: Core release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without v prefix
        required: true
      release_notes:
        description: Customer-visible release notes
        required: true

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: core-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify-build-publish-beta:
    runs-on: ubuntu-24.04
    environment: marketplace-production
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm, cache-dependency-path: backend/package-lock.json }
      - name: Verify backend
        working-directory: backend
        run: npm ci && npm test -- --runInBand && npm run build && npm audit --omit=dev --audit-level=high
      - name: Verify frontend
        working-directory: frontend
        run: npm ci && npm run build && npm audit --omit=dev --audit-level=high
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: sigstore/cosign-installer@v3.8.2
      - name: Build and push API with attestations
        id: api
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ghcr.io/${{ github.repository }}/api:${{ inputs.version }}-beta
          sbom: true
          provenance: mode=max
      - name: Build and push web with attestations
        id: web
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ghcr.io/${{ github.repository }}/web:${{ inputs.version }}-beta
          sbom: true
          provenance: mode=max
      - name: Build and push gateway with attestations
        id: gateway
        uses: docker/build-push-action@v6
        with:
          context: infrastructure/gateway
          push: true
          tags: ghcr.io/${{ github.repository }}/gateway:${{ inputs.version }}-beta
          sbom: true
          provenance: mode=max
      - name: Keyless-sign immutable image digests
        env:
          API: ghcr.io/${{ github.repository }}/api@${{ steps.api.outputs.digest }}
          WEB: ghcr.io/${{ github.repository }}/web@${{ steps.web.outputs.digest }}
          GATEWAY: ghcr.io/${{ github.repository }}/gateway@${{ steps.gateway.outputs.digest }}
        run: |
          cosign sign --yes "$API"
          cosign sign --yes "$WEB"
          cosign sign --yes "$GATEWAY"
      - name: Write release evidence
        env:
          VERSION: ${{ inputs.version }}
          API: ghcr.io/${{ github.repository }}/api@${{ steps.api.outputs.digest }}
          WEB: ghcr.io/${{ github.repository }}/web@${{ steps.web.outputs.digest }}
          GATEWAY: ghcr.io/${{ github.repository }}/gateway@${{ steps.gateway.outputs.digest }}
        run: node tools/release-evidence.js --version "$VERSION" --channel beta --api "$API" --web "$WEB" --gateway "$GATEWAY" --output release-evidence.json
      - name: Render and verify digest-pinned school deployment blueprint
        run: |
          node tools/render-school-release.js --evidence release-evidence.json --output school-release.json
          node tools/verify-school-release.js school-release.json > school-release-verification.json
      - uses: actions/attest-build-provenance@v2
        with: { subject-path: release-evidence.json }
      - uses: actions/attest-build-provenance@v2
        with: { subject-path: school-release.json }
      - uses: actions/upload-artifact@v4
        with:
          name: core-${{ inputs.version }}-release-evidence
          path: |
            release-evidence.json
            school-release.json
            school-release-verification.json
          if-no-files-found: error
      - name: Publish signed repository beta metadata
        env:
          MARKETPLACE_URL: ${{ secrets.MARKETPLACE_URL }}
          MARKETPLACE_ADMIN_TOKEN: ${{ secrets.MARKETPLACE_ADMIN_TOKEN }}
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.release_notes }}
          API: ghcr.io/${{ github.repository }}/api@${{ steps.api.outputs.digest }}
          WEB: ghcr.io/${{ github.repository }}/web@${{ steps.web.outputs.digest }}
          GATEWAY: ghcr.io/${{ github.repository }}/gateway@${{ steps.gateway.outputs.digest }}
        run: node tools/publish-core-release.js
