name: Core release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without v prefix
        required: true
      release_notes:
        description: Customer-visible release notes
        required: true

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: core-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify-build-publish-beta:
    runs-on: ubuntu-24.04
    environment: marketplace-production
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Validate release inputs before building
        env:
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.release_notes }}
        run: node tools/validate-core-release-input.js --version "$VERSION" --release-notes "$NOTES"
      - name: Normalize immutable image repository
        shell: bash
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            packages/plugin-cli/package-lock.json
      - name: Install plugin CLI test dependencies
        working-directory: packages/plugin-cli
        run: npm ci
      - name: Verify backend
        working-directory: backend
        run: npm ci && npm test -- --runInBand && npm audit --omit=dev --audit-level=moderate
      - name: Verify frontend
        working-directory: frontend
        run: npm ci && npm audit --omit=dev --audit-level=moderate
      - name: Verify core release workflow contract
        run: node --test tools/core-release-workflow-contract.test.js tools/core-docker-artifact-contract.test.js tools/core-deployment-blueprint-contract.test.js
      - name: Build physical lean-core API and web artifacts
        run: npm run build:core
      - name: Reject optional modules and pages before publishing
        run: npm run architecture:clean-core:gate
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: sigstore/cosign-installer@v3.8.2
      - name: Build and push API with attestations
        id: api
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.core
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/api:${{ inputs.version }}-beta
          sbom: true
          provenance: mode=max
      - name: Build and push web with attestations
        id: web
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile.core
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/web:${{ inputs.version }}-beta
          sbom: true
          provenance: mode=max
      - name: Build and push gateway with attestations
        id: gateway
        uses: docker/build-push-action@v6
        with:
          context: infrastructure/gateway
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/gateway:${{ inputs.version }}-beta
          sbom: true
          provenance: mode=max
      - name: Scan immutable API digest
        id: api-scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/api@${{ steps.api.outputs.digest }}
          format: json
          output: api-trivy.json
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan immutable web digest
        id: web-scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/web@${{ steps.web.outputs.digest }}
          format: json
          output: web-trivy.json
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan immutable gateway digest
        id: gateway-scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/gateway@${{ steps.gateway.outputs.digest }}
          format: json
          output: gateway-trivy.json
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Retain immutable digest vulnerability reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-${{ inputs.version }}-vulnerability-reports
          path: |
            api-trivy.json
            web-trivy.json
            gateway-trivy.json
          if-no-files-found: warn
      - name: Enforce immutable digest vulnerability gate
        if: always()
        env:
          API_SCAN: ${{ steps.api-scan.outcome }}
          WEB_SCAN: ${{ steps.web-scan.outcome }}
          GATEWAY_SCAN: ${{ steps.gateway-scan.outcome }}
        run: |
          test "$API_SCAN" = success
          test "$WEB_SCAN" = success
          test "$GATEWAY_SCAN" = success
      - name: Keyless-sign immutable image digests
        env:
          API: ${{ env.IMAGE_PREFIX }}/api@${{ steps.api.outputs.digest }}
          WEB: ${{ env.IMAGE_PREFIX }}/web@${{ steps.web.outputs.digest }}
          GATEWAY: ${{ env.IMAGE_PREFIX }}/gateway@${{ steps.gateway.outputs.digest }}
        run: |
          cosign sign --yes "$API"
          cosign sign --yes "$WEB"
          cosign sign --yes "$GATEWAY"
      - name: Write release evidence
        env:
          VERSION: ${{ inputs.version }}
          API: ${{ env.IMAGE_PREFIX }}/api@${{ steps.api.outputs.digest }}
          WEB: ${{ env.IMAGE_PREFIX }}/web@${{ steps.web.outputs.digest }}
          GATEWAY: ${{ env.IMAGE_PREFIX }}/gateway@${{ steps.gateway.outputs.digest }}
        run: node tools/release-evidence.js --version "$VERSION" --channel beta --api "$API" --web "$WEB" --gateway "$GATEWAY" --output release-evidence.json
      - name: Render and verify digest-pinned school deployment blueprint
        run: |
          node tools/render-school-release.js --evidence release-evidence.json --output school-release.json
          node tools/verify-school-release.js school-release.json > school-release-verification.json
          node tools/verify-core-image-signatures.js --blueprint school-release.json
      - uses: actions/attest-build-provenance@v2
        with: { subject-path: release-evidence.json }
      - uses: actions/attest-build-provenance@v2
        with: { subject-path: school-release.json }
      - uses: actions/upload-artifact@v4
        with:
          name: core-${{ inputs.version }}-release-evidence
          path: |
            release-evidence.json
            school-release.json
            school-release-verification.json
            api-trivy.json
            web-trivy.json
            gateway-trivy.json
          if-no-files-found: error
      - name: Publish signed repository beta metadata
        env:
          MARKETPLACE_URL: ${{ secrets.MARKETPLACE_URL }}
          MARKETPLACE_ADMIN_TOKEN: ${{ secrets.MARKETPLACE_ADMIN_TOKEN }}
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.release_notes }}
          API: ${{ env.IMAGE_PREFIX }}/api@${{ steps.api.outputs.digest }}
          WEB: ${{ env.IMAGE_PREFIX }}/web@${{ steps.web.outputs.digest }}
          GATEWAY: ${{ env.IMAGE_PREFIX }}/gateway@${{ steps.gateway.outputs.digest }}
        run: node tools/publish-core-release.js
