<!doctype html>
<html lang="km">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tables</title>
  <link rel="stylesheet" href="../pos.css">
  <style>
    .floor { position: relative; height: 560px; background: repeating-linear-gradient(0deg, #fff, #fff 39px, #eef1f4 40px), repeating-linear-gradient(90deg, transparent, transparent 39px, #eef1f4 40px); border: 1px solid var(--line); border-radius: 14px; overflow: auto; touch-action: none; }
    .tbl { position: absolute; width: 96px; height: 76px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: #fff; border: 2px solid #cfd6de; font-weight: 800; user-select: none; padding: 4px; }
    .tbl.ROUND { border-radius: 50%; width: 84px; height: 84px; } .tbl.LONG { width: 150px; }
    .tbl.busy { background: #fff4e0; border-color: #f3a93b; } .tbl.ready { background: #e8f6ee; border-color: #22a35a; }
    .tbl small { font-weight: 600; color: var(--muted); font-size: 12px; }
    .editing .tbl { cursor: grab; border-style: dashed; }
    .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
  <main id="app" aria-busy="true">
    <div class="spread"><h1>🍽️ Tables · តុ</h1>
      <div class="row"><span class="legend"><span>⬜ free</span><span>🟧 eating</span><span>🟩 food ready</span></span><button type="button" id="edit" hidden>✏️ Arrange tables</button></div>
    </div>
    <div id="error" class="notice bad" hidden></div>
    <div id="editor" class="panel" hidden>
      <div class="row"><label>Name<input id="t-name" maxlength="30" size="8"></label><label>Seats<input id="t-seats" type="number" min="1" max="50" value="4" style="width:80px"></label><label>Area<input id="t-area" maxlength="40" placeholder="Inside, terrace…"></label><label>Shape<select id="t-shape"><option value="SQUARE">Square</option><option value="ROUND">Round</option><option value="LONG">Long</option></select></label><button type="button" class="primary" id="t-save">Add table</button><button type="button" id="t-remove" class="danger" hidden>Remove</button><button type="button" id="t-done">Done</button></div>
      <p class="muted">Drag tables to place them; tap one to rename it.</p>
    </div>
    <div id="floor" class="floor" aria-label="Floor plan"></div>
  </main>
  <script src="../wattanam-plugin-ui.js"></script>
  <script src="../pos.js"></script>
  <script src="tables.js"></script>
</body>
</html>
