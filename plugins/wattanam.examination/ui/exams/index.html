<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Examinations</title>
  <link rel="stylesheet" href="../exam.css">
</head>
<body>
  <main id="app" aria-busy="true">
    <div class="head">
      <div>
        <h1>📝 Examinations <span class="kh muted" style="font-weight:600;font-size:16px">· ការប្រឡង</span></h1>
        <p class="sub">Author exams, publish them to a class, and grade student attempts</p>
      </div>
      <button type="button" class="primary" id="create" hidden>＋ Create Exam</button>
    </div>
    <div id="error" class="notice bad" hidden></div>
    <div id="message" class="notice ok" hidden></div>
    <div id="stats" class="grid4" style="margin-bottom:16px" hidden></div>
    <div class="row" id="filters" style="margin-bottom:12px" hidden>
      <input id="search" type="search" placeholder="Search exams…" aria-label="Search exams" style="max-width:280px">
      <select id="status-filter" aria-label="Status" style="width:auto">
        <option value="">All statuses</option><option value="DRAFT">Draft</option><option value="PUBLISHED">Published</option><option value="ACTIVE">Active</option><option value="COMPLETED">Completed</option>
      </select>
      <select id="class-filter" aria-label="Class" style="width:auto"><option value="">All classes</option></select>
    </div>
    <div id="list" class="stack"></div>
  </main>
  <script src="../wattanam-plugin-ui.js"></script>
  <script src="../exam.js"></script>
  <script src="exams.js"></script>
</body>
</html>
