<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gradebook</title>
  <link rel="stylesheet" href="../exam.css">
</head>
<body>
  <main id="app" aria-busy="true">
    <div class="head">
      <div class="row" style="gap:12px">
        <button type="button" class="link" id="back">← Back</button>
        <div><h1 id="heading">📊 Gradebook</h1><p class="sub" id="subheading"></p></div>
      </div>
      <div class="row">
        <button type="button" class="sm" id="csv" hidden>⬇ Scores (CSV)</button>
      </div>
    </div>
    <div id="error" class="notice bad" hidden></div>
    <div id="message" class="notice ok" hidden></div>
    <div id="stats" class="grid4" style="margin-bottom:16px"></div>
    <div class="row" id="filters" style="margin-bottom:12px" hidden>
      <div class="pager" id="tabs" style="margin:0;justify-content:flex-start"></div>
      <input id="search" type="search" placeholder="Search students…" aria-label="Search students" style="max-width:240px">
    </div>
    <div id="list" class="stack"></div>
  </main>
  <script src="../wattanam-plugin-ui.js"></script>
  <script src="../exam.js"></script>
  <script src="../questions.js"></script>
  <script src="gradebook.js"></script>
</body>
</html>
